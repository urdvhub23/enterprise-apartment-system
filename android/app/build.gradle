plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apartment.manager'
    compileSdk 34

    defaultConfig {
        applicationId "com.apartment.manager"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // Point this at your deployed API gateway (see docs/ARCHITECTURE.md).
        buildConfigField "String", "API_BASE_URL", '"https://api.yourdomain.com/api/"'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Networking — talks to the same Express API gateway as the web app
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Realtime chat / notifications socket
    implementation 'io.socket:socket.io-client:2.1.0'
}
