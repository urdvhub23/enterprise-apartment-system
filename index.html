<!DOCTYPE html>
<html>
<head>
    <title>Enterprise Apartment Management System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; text-align: center; padding: 50px; }
        .dashboard { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px gray; display: inline-block; }
        h1 { color: #2c3e50; }
        .alert { background: #e74c3c; color: white; padding: 10px; margin: 10px 0; border-radius: 5px;}
        .button { background: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;}
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Karachi Heights Resident Portal</h1>
        <p>Welcome to the Enterprise Apartment Management System.</p>
        
        <div class="alert">
            Notice: Elevator in Block B is currently under maintenance.
        </div>

        <h3>Your Quick Actions</h3>
        <button class="button">Pay Monthly Rent</button>
        <button class="button">Submit Maintenance Complaint</button>
        <button class="button">View Visitor Logs</button>
        
        <p style="margin-top: 30px; font-size: 12px; color: gray;">
            DevOps Pipeline Version 1.0 - Operating Normally
        </p>
    </div>
</body>
</html>
