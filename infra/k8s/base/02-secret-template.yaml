# TEMPLATE ONLY -- do not fill in real values and commit this file.
# Real secrets get created imperatively (see infra/k8s/README.md), e.g.:
#   kubectl create secret generic ams-secrets \
#     --namespace apartment-system \
#     --from-literal=PG_PASSWORD='...' \
#     --from-literal=JWT_SECRET='...' \
#     --from-literal=CLIENT_URL='https://your-domain.com'
#
# This mirrors exactly the .env.production approach from the Docker Compose
# deployment (real values live outside git), just expressed the
# Kubernetes-native way. In a fuller enterprise setup this Secret would
# instead be synced from AWS Secrets Manager or HashiCorp Vault via the
# External Secrets Operator -- noted here as the next maturity step rather
# than implemented, since it needs a real secrets backend to demonstrate.
apiVersion: v1
kind: Secret
metadata:
  name: ams-secrets
  namespace: apartment-system
type: Opaque
stringData:
  PG_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  CLIENT_URL: "REPLACE_ME"
  MONGO_URI: "mongodb://mongo:27017/apartment_docs"
