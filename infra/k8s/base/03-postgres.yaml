# Postgres runs as a StatefulSet, not a Deployment. Why this matters:
# a Deployment's pods are interchangeable and can be rescheduled to any
# node with a fresh identity; a StatefulSet gives Postgres a stable
# network identity (postgres-0) and a PersistentVolumeClaim that follows
# the pod even if it's rescheduled -- required for a database, where
# losing the attached disk means losing the data.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: apartment-system
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: ams-config, key: PG_USER } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: ams-config, key: PG_DATABASE } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ams-secrets, key: PG_PASSWORD } }
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: apartment-system
spec:
  clusterIP: None   # headless service -- required for StatefulSet stable DNS (postgres-0.postgres)
  selector:
    app: postgres
  ports:
    - port: 5432
