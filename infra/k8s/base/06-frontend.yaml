apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: apartment-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/urdvhub23/enterprise-apartment-system-frontend:5b14ae0f6b81651b5cf679458bb9782c90b7cff8
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: apartment-system
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
