# Kustomize lets `kubectl apply -k infra/k8s/base` deploy every manifest in
# this folder as one unit, in the right order, without a separate templating
# tool -- and lets ArgoCD (see infra/argocd/application.yaml) point at this
# single folder as the declarative "desired state" for GitOps.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apartment-system
resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-secret-template.yaml
  - 03-postgres.yaml
  - 04-mongo.yaml
  - 05-backend.yaml
  - 06-frontend.yaml
  - 07-ingress.yaml
