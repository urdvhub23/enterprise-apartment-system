# Backend is a Deployment, not a StatefulSet -- unlike Postgres/Mongo it's
# stateless (no local data to preserve), so pods ARE interchangeable and
# safely horizontally scalable. That statelessness is exactly what makes
# the HPA below possible: you can only autoscale a service safely if any
# replica can handle any request, which is true here because all state
# lives in Postgres/Mongo, not in the backend process itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: apartment-system
spec:
  replicas: 2   # start at 2 for basic redundancy; HPA scales beyond this under load
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Built and pushed by the CI/CD pipeline (see
          # .github/workflows/ci-cd.yml) -- this tag gets updated by that
          # pipeline, which is what ArgoCD then detects and syncs (GitOps).
          
          image: ghcr.io/urdvhub23/enterprise-apartment-system-backend:df010025fa52562c1ef40926c48374dd0173f83f

          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef: { name: ams-config }
            - secretRef: { name: ams-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: apartment-system
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
# This is the direct implementation of "Kubernetes provides Horizontal Pod
# Autoscaling (HPA) to automatically handle traffic spikes during morning
# and evening hours" from the proposal. It watches average CPU utilization
# across all backend pods and adds/removes replicas to keep it near 70%.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: apartment-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
