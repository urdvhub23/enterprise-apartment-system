# Helm values for the Trivy Operator -- this is DIFFERENT from the Trivy
# scan already in the CI pipeline (.github/workflows/ci-cd.yml). CI's
# Trivy scan is a point-in-time check before an image is pushed; the
# Trivy Operator runs continuously INSIDE the cluster, re-scanning every
# running workload on a schedule -- catching newly-disclosed CVEs in
# images that already passed CI weeks ago and are still running. Both are
# needed for what the proposal actually asks for: "Trivy scans all Docker
# images and dependencies for vulnerabilities in the CI pipeline" (CI job)
# plus genuine runtime vulnerability visibility (this operator).
#
# Install with:
#   helm repo add aqua https://aquasecurity.github.io/helm-charts
#   helm install trivy-operator aqua/trivy-operator \
#     --namespace trivy-system --create-namespace \
#     -f infra/k8s/security/values-trivy-operator.yaml

trivy:
  ignoreUnfixed: true    # don't alert on CVEs with no available fix yet -- noise reduction
  severity: "CRITICAL,HIGH"

operator:
  scanJobsConcurrentLimit: 2
  # Re-scan every workload in the apartment-system namespace every 24h,
  # independent of when it was last deployed.
  vulnerabilityScannerScanOnlyCurrentRevisions: true

resources:
  requests: { cpu: "100m", memory: "128Mi" }
  limits: { cpu: "200m", memory: "256Mi" }
